    <script>
        document.onkeydown = disableKeys;
        
        function disableKeys(e) {
            var key = e.which || window.event.keyCode;
            
            // Blocks Ctrl+C (Copy), Ctrl+S (Save), Ctrl+P (Print)
            if (e.ctrlKey && (key == 67 || key == 83 || key == 80)) {
                if (window.event) {
                    window.event.returnValue = false;
                } else {
                    e.preventDefault();
                }
            }
        }
    </script>
